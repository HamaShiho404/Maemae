<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>まえもって - 準備スケジュール管理アプリ</title>

  <!-- 添付画像デザインのSVGファビコン -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='50' fill='%239E2A2B'/><rect x='22' y='25' width='56' height='50' rx='8' fill='white'/><path d='M35 18 v10 M65 18 v10' stroke='%239E2A2B' stroke-width='4' stroke-linecap='round'/><path d='M22 42 h56' stroke='%239E2A2B' stroke-width='14'/><circle cx='32' cy='52' r='3' fill='white'/><circle cx='44' cy='52' r='3' fill='white'/><circle cx='56' cy='52' r='3' fill='white'/><circle cx='68' cy='52' r='3' fill='white'/><circle cx='32' cy='63' r='3' fill='white'/><circle cx='44' cy='63' r='3' fill='white'/><circle cx='56' cy='63' r='3' fill='white'/><circle cx='68' cy='63' r='3' fill='white'/><path d='M43 52 h26' stroke='%23FFD100' stroke-width='4' stroke-linecap='round' opacity='0.9'/><path d='M31 63 h26' stroke='%23FFD100' stroke-width='4' stroke-linecap='round' opacity='0.9'/><path d='M88 28 L70 46 L65 47 L66 42 L84 24 z' fill='%23FFD100'/><path d='M88 28 L92 32 L74 50 L70 46 z' fill='%23E6B800'/></svg>">

  <!-- Reggae One フォント -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Reggae+One&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & ReactDOM CDN -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { reggae: ['"Reggae One"', 'cursive', 'sans-serif'] },
          colors: {
            appRed: { DEFAULT: '#9E2A2B', hover: '#822223', light: '#FDF2F2' }
          }
        }
      }
    }
  </script>
  <style>
    *, ::before, ::after {
      box-sizing: border-box;
    }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased selection:bg-red-100 selection:text-[#9E2A2B]">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const formatDate = (dateObj) => {
      const y = dateObj.getFullYear();
      const m = String(dateObj.getMonth() + 1).padStart(2, '0');
      const d = String(dateObj.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    };

    /* アプリロゴSVGコンポーネント */
    const AppLogoIcon = ({ className = "w-10 h-10" }) => (
      <svg className={className} viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="50" cy="50" r="50" fill="#9E2A2B"/>
        <rect x="22" y="25" width="56" height="50" rx="8" fill="white"/>
        <path d="M35 18 v10 M65 18 v10" stroke="#9E2A2B" strokeWidth="4" strokeLinecap="round"/>
        <path d="M22 42 h56" stroke="#9E2A2B" strokeWidth="14"/>
        <circle cx="32" cy="52" r="3" fill="white"/>
        <circle cx="44" cy="52" r="3" fill="white"/>
        <circle cx="56" cy="52" r="3" fill="white"/>
        <circle cx="68" cy="52" r="3" fill="white"/>
        <circle cx="32" cy="63" r="3" fill="white"/>
        <circle cx="44" cy="63" r="3" fill="white"/>
        <circle cx="56" cy="63" r="3" fill="white"/>
        <circle cx="68" cy="63" r="3" fill="white"/>
        <path d="M43 52 h26" stroke="#FFD100" strokeWidth="4" strokeLinecap="round" opacity="0.9"/>
        <path d="M31 63 h26" stroke="#FFD100" strokeWidth="4" strokeLinecap="round" opacity="0.9"/>
        <path d="M88 28 L70 46 L65 47 L66 42 L84 24 z" fill="#FFD100"/>
        <path d="M88 28 L92 32 L74 50 L70 46 z" fill="#E6B800"/>
        <circle cx="89" cy="27" r="2" fill="#9E2A2B"/>
      </svg>
    );

    const categoryConfig = {
      study: { label: '学習', bg: 'bg-[#9E2A2B]', text: 'text-[#9E2A2B]' },
      activity: { label: '課外活動', bg: 'bg-slate-700', text: 'text-slate-700' },
      other: { label: 'その他', bg: 'bg-slate-500', text: 'text-slate-500' }
    };

    function App() {
      // ローカルストレージから初期データを読み込み
      const [events, setEvents] = useState(() => {
        try {
          const saved = localStorage.getItem('maemotte_events');
          return saved ? JSON.parse(saved) : [];
        } catch (e) {
          return [];
        }
      });

      const [offDays, setOffDays] = useState(() => {
        try {
          const saved = localStorage.getItem('maemotte_offdays');
          return saved ? JSON.parse(saved) : [];
        } catch (e) {
          return [];
        }
      });

      // デフォルト画面は「dashboard（本日の予定）」
      const [viewMode, setViewMode] = useState('dashboard');
      const [eventToDelete, setEventToDelete] = useState(null);

      const today = new Date();
      const todayStr = formatDate(today);

      const [currentYear, setCurrentYear] = useState(today.getFullYear());
      const [currentMonth, setCurrentMonth] = useState(today.getMonth() + 1);

      const [isAddModalOpen, setIsAddModalOpen] = useState(false);
      const [isOffDayModalOpen, setIsOffDayModalOpen] = useState(false);
      const [selectedMemo, setSelectedMemo] = useState(null);
      const [selectedEventDetail, setSelectedEventDetail] = useState(null);

      // ローカルストレージへの自動保存
      useEffect(() => {
        localStorage.setItem('maemotte_events', JSON.stringify(events));
      }, [events]);

      useEffect(() => {
        localStorage.setItem('maemotte_offdays', JSON.stringify(offDays));
      }, [offDays]);

      const calculatePrepDays = (eventDateStr, prepDaysCount, currentOffDays) => {
        const result = [];
        let curr = new Date(eventDateStr);
        curr.setDate(curr.getDate() - 1);

        let count = 0;
        const targetCount = parseInt(prepDaysCount) || 3;

        while (count < targetCount) {
          const dateStr = formatDate(curr);
          if (!currentOffDays.includes(dateStr)) {
            result.unshift(dateStr);
            count++;
          }
          curr.setDate(curr.getDate() - 1);
        }
        return result;
      };

      const handleAddEvent = (newEventData) => {
        const prepDays = calculatePrepDays(newEventData.eventDate, newEventData.prepDaysCount, offDays);
        const newEvent = {
          ...newEventData,
          id: Date.now().toString(),
          prepDays,
          completedDays: []
        };
        setEvents([...events, newEvent]);
        setIsAddModalOpen(false);
      };

      const handleDeleteEvent = (eventId) => {
        setEvents(events.filter(e => e.id !== eventId));
        setEventToDelete(null);
        setSelectedEventDetail(null);
      };

      const toggleComplete = (eventId, dateStr) => {
        const updatedEvents = events.map(event => {
          if (event.id !== eventId) return event;
          const isCompleted = event.completedDays.includes(dateStr);
          const newCompleted = isCompleted
            ? event.completedDays.filter(d => d !== dateStr)
            : [...event.completedDays, dateStr];
          return { ...event, completedDays: newCompleted };
        });
        setEvents(updatedEvents);
      };

      const handleAddOffDay = (dateStr) => {
        if (!dateStr || offDays.includes(dateStr)) return;
        const newOffDays = [...offDays, dateStr];
        const updatedEvents = events.map(ev => ({
          ...ev,
          prepDays: calculatePrepDays(ev.eventDate, ev.prepDaysCount, newOffDays)
        }));
        setOffDays(newOffDays);
        setEvents(updatedEvents);
      };

      const handleRemoveOffDay = (dateStr) => {
        const newOffDays = offDays.filter(d => d !== dateStr);
        const updatedEvents = events.map(ev => ({
          ...ev,
          prepDays: calculatePrepDays(ev.eventDate, ev.prepDaysCount, newOffDays)
        }));
        setOffDays(newOffDays);
        setEvents(updatedEvents);
      };

      const countdownEvent = events.find(e => e.showCountdown && new Date(e.eventDate) >= new Date(todayStr));
      const daysLeft = countdownEvent ? Math.ceil((new Date(countdownEvent.eventDate) - new Date(todayStr)) / (1000 * 60 * 60 * 24)) : null;

      const todayTasks = events.filter(e => e.prepDays.includes(todayStr) || e.eventDate === todayStr);

      const firstDayOfWeek = new Date(currentYear, currentMonth - 1, 1).getDay();
      const daysInMonth = new Date(currentYear, currentMonth, 0).getDate();

      const calendarCells = [];
      for (let i = 0; i < firstDayOfWeek; i++) {
        calendarCells.push(null);
      }
      for (let d = 1; d <= daysInMonth; d++) {
        const mStr = String(currentMonth).padStart(2, '0');
        const dStr = String(d).padStart(2, '0');
        calendarCells.push({ dayNum: d, dateStr: `${currentYear}-${mStr}-${dStr}` });
      }

      return (
        <div className="min-h-screen flex flex-col bg-slate-50 font-sans pb-12">
          {/* ヘッダー（シンプルロゴ表示のみ） */}
          <header className="bg-white border-b border-slate-200 px-6 py-3 flex items-center justify-between sticky top-0 z-30 shadow-xs">
            <div className="flex items-center space-x-2.5 cursor-pointer" onClick={() => setViewMode('dashboard')}>
              <AppLogoIcon className="w-9 h-9" />
              <h1 className="text-xl font-reggae text-[#9E2A2B] tracking-wide">まえもって</h1>
            </div>
          </header>

          <main className="flex-1 max-w-5xl w-full mx-auto p-4 md:p-6 space-y-6">
            
            {}
            {countdownEvent && (
              <div className="bg-gradient-to-r from-[#9E2A2B] to-[#7A1F20] text-white rounded-2xl p-5 shadow-sm flex items-center justify-between">
                <div className="flex items-center space-x-3">
                  <div className="bg-white/10 p-2.5 rounded-xl text-xl">📅</div>
                  <div>
                    <div className="text-xs text-amber-300 font-bold">次の目標</div>
                    <div className="text-xl font-bold font-reggae">{countdownEvent.title}</div>
                  </div>
                </div>
                <div className="flex items-center space-x-4">
                  <div className="text-right">
                    <div className="text-xs text-white/80">本番まであと</div>
                    <div className="text-3xl font-extrabold font-reggae text-amber-300">{daysLeft} <span className="text-sm text-white font-normal">日</span></div>
                  </div>
                  <button
                    onClick={() => setEventToDelete(countdownEvent)}
                    title="この予定を削除"
                    className="p-2 bg-white/10 hover:bg-white/20 rounded-xl text-white/80 hover:text-white transition"
                  >
                    🗑️
                  </button>
                </div>
              </div>
            )}

            {}
            {viewMode === 'calendar' ? (
              /* カレンダー画面 */
              <div className="bg-white rounded-2xl p-5 border border-slate-200/80 shadow-xs space-y-4">
                <div className="flex items-center justify-between flex-wrap gap-2">
                  <button onClick={() => setViewMode('dashboard')} className="text-xs font-bold text-slate-600 hover:text-slate-900 border px-3.5 py-1.5 rounded-xl bg-slate-50 transition">
                    ＜ 本日の予定
                  </button>

                  <div className="flex items-center space-x-3">
                    <button
                      onClick={() => {
                        if (currentMonth === 1) { setCurrentYear(y => y - 1); setCurrentMonth(12); }
                        else { setCurrentMonth(m => m - 1); }
                      }}
                      className="px-2 py-1 text-slate-400 hover:text-slate-700 font-bold"
                    >
                      ＜
                    </button>
                    <span className="text-xl font-bold font-reggae text-slate-800">{currentYear}年 {currentMonth}月</span>
                    <button
                      onClick={() => {
                        if (currentMonth === 12) { setCurrentYear(y => y + 1); setCurrentMonth(1); }
                        else { setCurrentMonth(m => m + 1); }
                      }}
                      className="px-2 py-1 text-slate-400 hover:text-slate-700 font-bold"
                    >
                      ＞
                    </button>
                  </div>

                  <div className="flex items-center space-x-2">
                    <button 
                      onClick={() => setIsOffDayModalOpen(true)} 
                      title="オフ日を設定"
                      className="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl transition text-xs font-bold flex items-center space-x-1"
                    >
                      <span>⚙️ オフ日設定</span>
                    </button>
                    <button 
                      onClick={() => setIsAddModalOpen(true)} 
                      title="予定追加"
                      className="w-9 h-9 flex items-center justify-center bg-[#9E2A2B] hover:bg-[#7A1F20] text-white rounded-full transition shadow-xs"
                    >
                      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="3" strokeLinecap="round" strokeLinejoin="round" className="w-5 h-5">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                      </svg>
                    </button>
                  </div>
                </div>

                <div className="grid grid-cols-7 gap-1 md:gap-2 pt-2">
                  {['日', '月', '火', '水', '木', '金', '土'].map((d, idx) => (
                    <div key={d} className={`text-center font-bold text-xs py-2 ${idx === 0 ? 'text-red-500' : idx === 6 ? 'text-blue-500' : 'text-slate-600'}`}>
                      {d}
                    </div>
                  ))}

                  {calendarCells.map((cell, idx) => {
                    if (!cell) {
                      return <div key={`empty-${idx}`} className="h-24 bg-slate-50/30 rounded-xl border border-transparent"></div>;
                    }

                    const { dayNum, dateStr } = cell;
                    const isToday = dateStr === todayStr;
                    const isOff = offDays.includes(dateStr);
                    const dayEvents = events.filter(e => e.eventDate === dateStr || e.prepDays.includes(dateStr));

                    return (
                      <div key={dateStr} className={`h-24 p-1.5 rounded-xl border flex flex-col justify-between ${isToday ? 'border-2 border-[#9E2A2B] bg-red-50/20' : 'bg-white border-slate-200'}`}>
                        <div className="flex items-center justify-between">
                          <span className={`text-xs font-bold ${isToday ? 'text-[#9E2A2B]' : 'text-slate-700'}`}>{dayNum}</span>
                          {isOff && <span className="text-[9px] bg-red-100 text-red-600 font-bold px-1 rounded">オフ</span>}
                        </div>

                        <div className="space-y-1 overflow-y-auto no-scrollbar">
                          {dayEvents.map(ev => {
                            const isMain = ev.eventDate === dateStr;
                            return (
                              <button
                                key={ev.id}
                                onClick={() => setSelectedEventDetail(ev)}
                                className={`w-full text-left text-[10px] p-1 rounded font-bold truncate transition hover:opacity-80 block ${
                                  isMain ? 'bg-[#9E2A2B] text-white' : 'bg-amber-100 text-amber-900'
                                }`}
                              >
                                {isMain && '【本番】'}{ev.title}
                              </button>
                            );
                          })}
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            ) : (
              /* デフォルト画面（本日の予定） */
              <div className="space-y-6">
                <div className="bg-white rounded-2xl p-5 border border-slate-200/80 shadow-xs space-y-4">
                  <div className="flex items-center justify-between border-b pb-3 flex-wrap gap-2">
                    <h2 className="text-base font-bold text-slate-800">
                      ■ 今日の日付：<span className="text-[#9E2A2B] font-reggae text-lg ml-1">{todayStr}</span>
                    </h2>
                    <div className="flex items-center space-x-2">
                      <button
                        onClick={() => setIsAddModalOpen(true)}
                        className="bg-[#9E2A2B] hover:bg-[#7A1F20] text-white px-3 py-1.5 rounded-xl text-xs font-bold transition flex items-center space-x-1 shadow-xs"
                      >
                        <span>＋ 予定を追加</span>
                      </button>
                      <button
                        onClick={() => setViewMode('calendar')}
                        className="text-xs font-bold text-slate-600 hover:text-slate-900 border px-3 py-1.5 rounded-xl bg-slate-50 flex items-center space-x-1 hover:bg-slate-100 transition"
                      >
                        <span>📅 カレンダー表示</span>
                      </button>
                    </div>
                  </div>

                  <div className="flex items-center justify-between">
                    <div className="text-xs font-bold text-slate-500">【 今日やる準備・予定 】</div>
                    <span className="text-xs bg-slate-100 text-slate-500 px-2.5 py-1 rounded-full font-bold">本日のタスク: {todayTasks.length}件</span>
                  </div>

                  <div className="space-y-3">
                    {todayTasks.length === 0 ? (
                      <p className="text-xs text-slate-400 py-6 text-center bg-slate-50 rounded-xl border border-dashed">本日の準備タスクはありません</p>
                    ) : (
                      todayTasks.map(event => {
                        const isMain = event.eventDate === todayStr;
                        const isDone = event.completedDays.includes(todayStr);
                        const cat = categoryConfig[event.category] || categoryConfig.other;
                        const currentDayIdx = event.prepDays.indexOf(todayStr) + 1;

                        return (
                          <div key={event.id} className="p-4 rounded-2xl border border-slate-200/80 bg-white flex items-center justify-between shadow-2xs gap-2">
                            <div className="flex items-center space-x-3 flex-1 min-w-0">
                              <span className={`text-xs px-2.5 py-1 rounded-lg text-white font-bold shrink-0 ${cat.bg}`}>{cat.label}</span>
                              <span className="font-bold text-slate-800 text-sm truncate">{event.title} {isMain ? '【本番】' : '準備'}</span>
                              {currentDayIdx > 0 && !isMain && (
                                <span className="text-xs text-slate-400 bg-slate-100 px-2 py-0.5 rounded font-mono shrink-0">Day {currentDayIdx}/{event.prepDays.length}</span>
                              )}
                            </div>

                            <div className="flex items-center space-x-2 shrink-0">
                              {event.memo && (
                                <button onClick={() => setSelectedMemo(event.memo)} className="text-xs text-[#9E2A2B] hover:underline font-bold px-2 py-1">メモ</button>
                              )}
                              <button
                                onClick={() => toggleComplete(event.id, todayStr)}
                                className={`px-3 py-1.5 rounded-xl text-xs font-bold transition shadow-2xs ${
                                  isDone ? 'bg-amber-100 text-amber-800 border border-amber-300' : 'bg-[#FDF2F2] text-[#9E2A2B] hover:bg-red-100'
                                }`}
                              >
                                {isDone ? '💮 完了' : 'スタンプ'}
                              </button>
                              <button
                                onClick={() => setEventToDelete(event)}
                                title="予定を削除"
                                className="p-1.5 text-slate-400 hover:text-red-600 rounded-lg transition hover:bg-red-50"
                              >
                                🗑️
                              </button>
                            </div>
                          </div>
                        );
                      })
                    )}
                  </div>
                </div>

                {/* 全予定一覧・管理エリア */}
                <div className="bg-white rounded-2xl p-5 border border-slate-200/80 shadow-xs space-y-4">
                  <div className="flex items-center justify-between">
                    <h2 className="text-base font-bold text-slate-800">■ 登録済みの予定一覧 ({events.length}件)</h2>
                    <button onClick={() => setViewMode('calendar')} className="text-xs text-[#9E2A2B] font-bold hover:underline flex items-center space-x-1">
                      <span>月カレンダーを開く</span>
                      <span>＞</span>
                    </button>
                  </div>

                  <div className="space-y-2">
                    {events.length === 0 ? (
                      <p className="text-xs text-slate-400 py-4 text-center">登録された予定はありません</p>
                    ) : (
                      events.map(ev => {
                        const cat = categoryConfig[ev.category] || categoryConfig.other;
                        return (
                          <div key={ev.id} className="flex items-center justify-between p-3 bg-slate-50 rounded-xl border border-slate-200/60 text-xs">
                            <div className="flex items-center space-x-3">
                              <span className={`px-2 py-0.5 rounded text-white font-bold ${cat.bg}`}>{cat.label}</span>
                              <span className="font-bold text-slate-800">{ev.title}</span>
                              <span className="text-slate-500">（本番: {ev.eventDate}）</span>
                            </div>
                            <button
                              onClick={() => setEventToDelete(ev)}
                              className="px-2.5 py-1 text-red-600 hover:bg-red-100 rounded-lg font-bold transition"
                            >
                              削除
                            </button>
                          </div>
                        );
                      })
                    )}
                  </div>
                </div>
              </div>
            )}
          </main>

          {}
          {/* 予定登録 モーダル */}
          {isAddModalOpen && (
            <AddEventModal defaultDate={todayStr} onClose={() => setIsAddModalOpen(false)} onAdd={handleAddEvent} />
          )}

          {/* オフ日設定 モーダル */}
          {isOffDayModalOpen && (
            <OffDayModal
              defaultDate={todayStr}
              offDays={offDays}
              onClose={() => setIsOffDayModalOpen(false)}
              onAdd={handleAddOffDay}
              onRemove={handleRemoveOffDay}
            />
          )}

          {/* メモ表示モーダル */}
          {selectedMemo && (
            <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-xs flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-2xl max-w-sm w-full p-5 space-y-3 shadow-xl">
                <h3 className="font-bold text-sm text-slate-800">📝 メモ内容</h3>
                <p className="text-xs text-slate-600 leading-relaxed bg-slate-50 p-3 rounded-xl border whitespace-pre-wrap">{selectedMemo}</p>
                <div className="flex justify-end">
                  <button onClick={() => setSelectedMemo(null)} className="px-4 py-1.5 bg-slate-100 hover:bg-slate-200 text-xs font-bold rounded-xl text-slate-700">閉じる</button>
                </div>
              </div>
            </div>
          )}

          {/* イベント詳細＆削除モーダル */}
          {selectedEventDetail && (
            <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-xs flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-2xl max-w-md w-full p-6 space-y-4 shadow-xl relative">
                <button onClick={() => setSelectedEventDetail(null)} className="absolute top-4 right-4 text-slate-400 hover:text-slate-600 w-8 h-8 rounded-full flex items-center justify-center text-sm font-bold border">✕</button>
                
                <div className="flex items-center space-x-2">
                  <span className={`text-xs px-2.5 py-1 rounded-lg text-white font-bold ${(categoryConfig[selectedEventDetail.category] || categoryConfig.other).bg}`}>
                    {(categoryConfig[selectedEventDetail.category] || categoryConfig.other).label}
                  </span>
                  <h3 className="font-bold text-base text-slate-800">{selectedEventDetail.title}</h3>
                </div>

                <div className="text-xs space-y-2 bg-slate-50 p-4 rounded-xl border text-slate-700">
                  <div><span className="font-bold">📅 本番日：</span>{selectedEventDetail.eventDate}</div>
                  <div><span className="font-bold">⏰ 準備期間：</span>{selectedEventDetail.prepDays.length} 日間</div>
                  {selectedEventDetail.memo && (
                    <div>
                      <span className="font-bold">📝 メモ：</span>
                      <p className="mt-1 text-slate-600 bg-white p-2 rounded border whitespace-pre-wrap">{selectedEventDetail.memo}</p>
                    </div>
                  )}
                </div>

                <div className="flex items-center justify-between pt-2">
                  <button
                    onClick={() => setEventToDelete(selectedEventDetail)}
                    className="px-4 py-2 bg-red-50 hover:bg-red-100 text-red-600 rounded-xl text-xs font-bold transition border border-red-200"
                  >
                    🗑️ 予定を削除
                  </button>
                  <button
                    onClick={() => setSelectedEventDetail(null)}
                    className="px-5 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 rounded-xl text-xs font-bold transition"
                  >
                    閉じる
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* 削除確認モーダル */}
          {eventToDelete && (
            <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-xs flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-2xl max-w-sm w-full p-6 space-y-4 shadow-2xl text-center">
                <div className="w-12 h-12 bg-red-100 text-red-600 rounded-full flex items-center justify-center mx-auto text-xl font-bold">
                  ⚠
                </div>
                <div>
                  <h3 className="font-bold text-slate-800 text-base">予定を削除しますか？</h3>
                  <p className="text-xs text-slate-500 mt-1">「{eventToDelete.title}」を削除します。この操作は取り消せません。</p>
                </div>
                <div className="flex items-center justify-center space-x-3 pt-2">
                  <button
                    onClick={() => setEventToDelete(null)}
                    className="px-5 py-2 border border-slate-200 text-slate-600 hover:bg-slate-50 rounded-xl text-xs font-bold"
                  >
                    キャンセル
                  </button>
                  <button
                    onClick={() => handleDeleteEvent(eventToDelete.id)}
                    className="px-5 py-2 bg-red-600 hover:bg-red-700 text-white rounded-xl text-xs font-bold shadow-xs"
                  >
                    削除する
                  </button>
                </div>
              </div>
            </div>
          )}

        </div>
      );
    }

    function AddEventModal({ defaultDate, onClose, onAdd }) {
      const [title, setTitle] = useState('');
      const [category, setCategory] = useState('study');
      const [eventDate, setEventDate] = useState(defaultDate);
      const [prepType, setPrepType] = useState('days');
      const [prepDaysCount, setPrepDaysCount] = useState(5);
      const [showCountdown, setShowCountdown] = useState(true);
      const [memo, setMemo] = useState('');

      const handleSubmit = (e) => {
        e.preventDefault();
        if (!title) return;
        onAdd({ title, category, eventDate, prepType, prepDaysCount, showCountdown, memo });
      };

      return (
        <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-xs flex items-center justify-center p-4 z-50">
          <div className="bg-white rounded-2xl max-w-lg w-full p-6 space-y-5 shadow-2xl relative">
            <button onClick={onClose} className="absolute top-4 right-4 text-slate-400 hover:text-slate-600 w-8 h-8 rounded-full flex items-center justify-center text-sm font-bold border">✕</button>
            
            <h3 className="text-base font-bold text-slate-800">予定・テストの登録</h3>

            <form onSubmit={handleSubmit} className="space-y-4 text-xs">
              <div>
                <label className="block font-bold text-slate-700 mb-1.5">タイトル</label>
                <input 
                  type="text" 
                  required 
                  placeholder="例：中間テスト（英語）" 
                  value={title} 
                  onChange={e => setTitle(e.target.value)} 
                  className="w-full box-border px-3.5 py-2.5 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-[#9E2A2B]/20" 
                />
              </div>

              <div>
                <label className="block font-bold text-slate-700 mb-1.5">カテゴリ</label>
                <div className="flex space-x-4 text-slate-700 font-bold">
                  <label className="flex items-center space-x-1.5 cursor-pointer">
                    <input type="radio" name="cat" value="study" checked={category === 'study'} onChange={() => setCategory('study')} />
                    <span>学習</span>
                  </label>
                  <label className="flex items-center space-x-1.5 cursor-pointer">
                    <input type="radio" name="cat" value="activity" checked={category === 'activity'} onChange={() => setCategory('activity')} />
                    <span>課外活動</span>
                  </label>
                  <label className="flex items-center space-x-1.5 cursor-pointer">
                    <input type="radio" name="cat" value="other" checked={category === 'other'} onChange={() => setCategory('other')} />
                    <span>その他</span>
                  </label>
                </div>
              </div>

              <div>
                <label className="block font-bold text-slate-700 mb-1.5">本番の日時</label>
                <div className="w-full">
                  <input 
                    type="date" 
                    required 
                    value={eventDate} 
                    onChange={e => setEventDate(e.target.value)} 
                    className="w-full box-border px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm font-bold text-slate-800 text-left focus:outline-none focus:ring-2 focus:ring-[#9E2A2B]/20 block" 
                  />
                </div>
              </div>

              <div className="p-4 border rounded-2xl space-y-3 bg-slate-50/50">
                <div className="font-bold text-slate-700">【準備日の指定方法】</div>
                <div className="space-y-2">
                  <label className="flex items-center space-x-2 font-bold cursor-pointer">
                    <input type="radio" name="pType" value="days" checked={prepType === 'days'} onChange={() => setPrepType('days')} />
                    <span>日数で指定</span>
                  </label>
                  
                  {prepType === 'days' && (
                    <div className="flex items-center space-x-2 pl-6">
                      <input type="number" min="1" max="30" value={prepDaysCount} onChange={e => setPrepDaysCount(e.target.value)} className="w-16 px-2 py-1 border rounded-lg text-center font-bold" />
                      <span className="text-slate-500">日前から開始（オフ日は自動でスキップされます）</span>
                    </div>
                  )}

                  <label className="flex items-center space-x-2 font-bold cursor-pointer pt-1">
                    <input type="radio" name="pType" value="date" checked={prepType === 'date'} onChange={() => setPrepType('date')} />
                    <span>日付で指定</span>
                  </label>
                </div>
              </div>

              <label className="flex items-center space-x-2 font-bold text-slate-700 cursor-pointer pt-1">
                <input type="checkbox" checked={showCountdown} onChange={e => setShowCountdown(e.target.checked)} className="rounded text-[#9E2A2B]" />
                <span>トップページにカウントダウン表示する</span>
              </label>

              <div>
                <label className="block font-bold text-slate-700 mb-1">メモ</label>
                <textarea rows="3" placeholder="範囲ややるべきことを記入..." value={memo} onChange={e => setMemo(e.target.value)} className="w-full box-border px-3.5 py-2 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-[#9E2A2B]/20"></textarea>
              </div>

              <div className="flex justify-end space-x-2 pt-2">
                <button type="button" onClick={onClose} className="px-5 py-2 border rounded-xl font-bold text-slate-600 hover:bg-slate-50">キャンセル</button>
                <button type="submit" className="px-6 py-2 bg-[#9E2A2B] hover:bg-[#7A1F20] text-white rounded-xl font-bold">保存する</button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    function OffDayModal({ defaultDate, offDays, onClose, onAdd, onRemove }) {
      const [inputDate, setInputDate] = useState(defaultDate);

      return (
        <div className="fixed inset-0 bg-slate-900/40 backdrop-blur-xs flex items-center justify-center p-4 z-50">
          <div className="bg-white rounded-2xl max-w-md w-full p-6 space-y-4 shadow-2xl relative">
            <button onClick={onClose} className="absolute top-4 right-4 text-slate-400 hover:text-slate-600 w-8 h-8 rounded-full flex items-center justify-center text-sm font-bold border">✕</button>

            <h3 className="text-base font-bold text-slate-800">オフ日の設定</h3>

            <p className="text-xs text-slate-500 leading-relaxed">
              部活の遠征など、「準備を行わない日」を指定できます。設定すると全予定からこの日が自動的にスキップされます。
            </p>

            <div className="flex space-x-2">
              <input type="date" value={inputDate} onChange={e => setInputDate(e.target.value)} className="flex-1 box-border px-3.5 py-2 bg-slate-50 border border-slate-200 rounded-xl text-sm font-bold text-left" />
              <button onClick={() => onAdd(inputDate)} className="px-5 py-2 bg-slate-800 hover:bg-slate-900 text-white rounded-xl text-xs font-bold">追加</button>
            </div>

            <div className="space-y-2 pt-2">
              <div className="text-xs font-bold text-slate-700">設定中のオフ一覧:</div>
              <div className="flex flex-wrap gap-2">
                {offDays.length === 0 ? (
                  <span className="text-xs text-slate-400">設定されているオフ日はありません。</span>
                ) : (
                  offDays.map(d => (
                    <span key={d} className="inline-flex items-center space-x-1 px-3 py-1 bg-red-50 text-red-600 border border-red-200 rounded-full text-xs font-bold">
                      <span>{d}</span>
                      <button onClick={() => onRemove(d)} className="hover:text-red-800 ml-1">✕</button>
                    </span>
                  ))
                )}
              </div>
            </div>

            <div className="flex justify-end pt-4">
              <button onClick={onClose} className="px-6 py-2 bg-[#9E2A2B] hover:bg-[#7A1F20] text-white rounded-xl text-xs font-bold">完了</button>
            </div>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
